[project]
name = "ideal-city-finder-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.15.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.12",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "anyio>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
